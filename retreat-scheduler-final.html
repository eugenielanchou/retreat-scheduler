const TYPE_DURATION_MIN = { PPS:180, CFS:180, FBI:120, PHENO:120 };

function slotsFor(type, day) {
  const sunday = SUNDAYS.has(day);
  if (type === "FBI") {
    // 2h sessions back-to-back, starting earlier (8:30), up to 5 per day —
    // the only pause is the mandatory 30-min midday break. No other gaps,
    // even if that means running into breakfast/lunch/dinner.
    const base = ["08:30–10:30","10:30–12:30","13:00–15:00","15:00–17:00","17:00–19:00"];
    return sunday ? base.slice(1) : base;

  if (type === "PHENO") {
    const base = ["09:00–11:00","13:30–15:30","17:00–19:00"];
    return sunday ? base.slice(1) : base;
  }
  const base = ["09:00–12:00","13:30–16:30","17:00–20:00"];
  return sunday ? base.slice(1) : base;

function capFor(type){ return 1; }

/* Returns the slots that should get a rendered lane in the timetable for
   a given type/day: the default template slots, plus any custom slot
   times that an admin has manually assigned (so manually-rescheduled or
   longer/shorter sessions still show up even if they don't match the
   default template). */
function blockSlotsFor(type, day) {
  const defaults = slotsFor(type, day);
  const custom = S.assignments.filter(a=>a.type===type && a.day===day).map(a=>a.slot);
  const set = new Set([...defaults, ...custom]);
  return [...set].sort((a,b)=>toMinutes(a.split("–")[0].trim())-toMinutes(b.split("–")[0].trim()));
}

function formatTimeFromMinutes(mins) {
  const wrapped = ((mins % (24*60)) + 24*60) % (24*60);
  const h = Math.floor(wrapped/60), m = wrapped%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function computeSlotFromStart(type, startTime) {
  const dur = TYPE_DURATION_MIN[type] || 90;
  const startMin = toMinutes(startTime);
  const endMin = startMin + dur;
  return `${startTime}–${formatTimeFromMinutes(endMin)}`;
}

/* Timetable grid: 30-min rows from 07:00 to 22:30, header occupies grid line 1-2 */
const TT_START_MIN = 7*60;
function timeToRowLine(t) {
  const [h,m] = t.trim().split(":").map(Number);
  return 2 + Math.round((h*60+m - TT_START_MIN)/30);
}
const TT_LANE_COL = { PPS:3, CFS:4, FBI:5, PHENO:6 }; // one column each — 1 concurrent session per type

function buildTimetableBlocks(day, isArrivalDay) {
  const blocks = [];
  const colOffset = isArrivalDay ? 2 : 0;

  MEALS.forEach(m=>{
    const [start,end] = m.time.split("–");
    const r1=timeToRowLine(start), r2=timeToRowLine(end);

        const r = timeToRowLine(p.arrivalTime);
        blocks.push({

    });

    // Add departures for this day
    S.participants.forEach(p=>{
      if (p.departureDate === day && p.departureTime && p.departureTime !== "morning" && p.departureTime !== "after lunch") {
        const r = timeToRowLine(p.departureTime);
        blocks.push({
          colStart: 2, colEnd: 3, r1: r, r2: r+1, z: 2,
          html: `<div style="height:100%;background:#f7e8e2;border-left:3px solid #b5533c;padding:4px;font-size:11px;font-weight:600;color:#7a3524;overflow:hidden;text-overflow:ellipsis;">${getParticipantName(p.id)} ↑</div>`
        });
      }
    });

    ["PPS","CFS","FBI","PHENO"].forEach(type=>{
      const slots = blockSlotsFor(type, day);
      slots.forEach(slot=>{
        const [start,end] = slot.split("–");
        const r1=timeToRowLine(start), r2=timeToRowLine(end);
        let col = TT_LANE_COL[type];
        const a = S.assignments.find(x=>x.type===type && x.day===day && x.slot===slot);
        const cellKey = `${type}|${day}|${slot}|0`;
        const inner = a
          ? `<div class="chip ${type.toLowerCase()}" draggable="true" data-assignid="${a.id}" data-action="editassign" data-id="${a.id}">${getParticipantName(a.participantId)}${a.note?`<div class="note">${esc(a.note)}</div>`:""}</div>`
          : `<div class="cell-empty" data-action="addassign" data-type="${type}" data-day="${day}" data-slot="${esc(slot)}">+ add</div>`;
        blocks.push({
          colStart:col, colEnd:col+1, r1, r2, z:2,
          html:`<div class="cell ${S.ui.dragOverKey===cellKey?'over':''}" data-cellkey="${cellKey}" data-type="${type}" data-day="${day}" data-slot="${esc(slot)}" ondragover="event.preventDefault();" data-action-drop="drop" style="height:100%;">${inner}</div>`,
        });
      });
    });
  } else {
    const isFirstArrivalDay = day === ARRIVAL_DAY_1;
    const arrivalColOffset = isFirstArrivalDay ? 0 : 1;
    ["PPS","CFS","FBI","PHENO"].forEach(type=>{
      const slots = blockSlotsFor(type, day);
      slots.forEach(slot=>{
        const [start,end] = slot.split("–");
        const r1=timeToRowLine(start), r2=timeToRowLine(end);
        let col = TT_LANE_COL[type] + arrivalColOffset;
        const a = S.assignments.find(x=>x.type===type && x.day===day && x.slot===slot);
        const cellKey = `${type}|${day}|${slot}|0`;
        const inner = a
          ? `<div class="chip ${type.toLowerCase()}" draggable="true" data-assignid="${a.id}" data-action="editassign" data-id="${a.id}">${getParticipantName(a.participantId)}${a.note?`<div class="note">${esc(a.note)}</div>`:""}</div>`
          : `<div class="cell-empty" data-action="addassign" data-type="${type}" data-day="${day}" data-slot="${esc(slot)}">+ add</div>`;
        blocks.push({
          colStart:col, colEnd:col+1, r1, r2, z:2,
          html:`<div class="cell ${S.ui.dragOverKey===cellKey?'over':''}" data-cellkey="${cellKey}" data-type="${type}" data-day="${day}" data-slot="${esc(slot)}" ondragover="event.preventDefault();" data-action-drop="drop" style="height:100%;">${inner}</div>`,
        });
      });
    });
  }
  return blocks;
}

/* ---------------------------------------------------------------- */
/* Scheduler                                                         */
/* ---------------------------------------------------------------- */
function eligibleDays(p) {
  if (p.status === "tbd" || !p.arrivalDate || !p.departureDate) return [];
  return RETREAT_DAYS[p.week].filter(d => d >= p.arrivalDate && d <= p.departureDate);
}

function generateSchedule(participants, week, existingAssignments) {
  const kept = existingAssignments.filter(a => a.week !== week || a.manual);
  const capacityUsed = {};
  const dayUsedByParticipant = {};
  const alreadyHasType = {};
  for (const a of kept) {
    const k = a.day+"|"+a.type+"|"+a.slot;
    capacityUsed[k] = (capacityUsed[k]||0)+1;
    (dayUsedByParticipant[a.participantId] ??= new Set()).add(a.day);
    (alreadyHasType[a.participantId] ??= new Set()).add(a.type);
  }
  const weekParticipants = participants.filter(p=>p.week===week);
  const withDays = weekParticipants
    .map(p=>({p, days: eligibleDays(p)}))
    .filter(({p,days}) => days.length>0 && !(alreadyHasType[p.id] && alreadyHasType[p.id].size>=3))
    .sort((a,b)=>a.days.length-b.days.length);

  const newAssignments = [];
  const unassigned = [];

  for (const {p,days} of withDays) {
    const usedDays = dayUsedByParticipant[p.id] || new Set();
    const have = alreadyHasType[p.id] || new Set();
    let allOk = true;
    for (const type of ["PPS","CFS","FBI"]) {
      if (have.has(type)) continue;
      let placed=false;
      for (const day of days) {
        if (usedDays.has(day)) continue;
        for (const slot of slotsFor(type, day)) {
          const k = day+"|"+type+"|"+slot;
          const used = capacityUsed[k]||0;
          if (used < capFor(type)) {
            capacityUsed[k]=used+1;
            usedDays.add(day);
            newAssignments.push({
              id: p.id+"-"+type+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),
              participantId:p.id, type, day, slot, note:"", week, manual:false,
            });
            placed=true; break;
          }
        }
        if (placed) break;
      }
      if (!placed) allOk=false;
    }
    if (!allOk) unassigned.push(p.id);
  }
  return { assignments:[...kept, ...newAssignments], unassigned };
}

/* ---------------------------------------------------------------- */
/* Persistence — Firebase Realtime Database                          */
/* All 18 tablets + any computer read/write the same database, so    */
/* changes made on one device appear on every other device.          */
/* ---------------------------------------------------------------- */
const STORE_KEYS = ["participants","assignments","links","announcements"];

async function loadState() {
  const state = { participants: SEED_PARTICIPANTS, assignments: SEED_ASSIGNMENTS, links: [], announcements: [] };
  for (const key of STORE_KEYS) {
    try {
      const snap = await db.ref(key).get();
      if (snap.exists()) state[key] = snap.val();
    } catch(e) { console.error("firebase get failed", key, e); }
  }
  return state;
}
async function saveKey(key, value) {
  try {
    await db.ref(key).set(value);
    setConnStatus("ok");
  } catch(e) {
    console.error("firebase set failed", key, e);
    setConnStatus("err");
  }
}
function setConnStatus(status) {
  S.ui.connStatus = status;
  const dot = document.getElementById("conn-dot");
  const label = document.getElementById("conn-label");
  if (dot) { dot.className = "conn-dot " + (status==="ok" ? "ok" : status==="err" ? "err" : ""); }
  if (label) { label.textContent = status==="ok" ? "Synchronisé" : status==="err" ? "Erreur de synchro" : "Connexion…"; }
}

function esc(s){ return (s??"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toMinutes(t){ const [h,m]=t.trim().split(":").map(Number); return h*60+m; }
function rangesOverlap(rangeA, rangeB){
  const [a1,a2] = rangeA.split("–").map(s=>toMinutes(s));
  const [b1,b2] = rangeB.split("–").map(s=>toMinutes(s));
  return a1 < b2 && b1 < a2;
}

async function persist(key, value) {
  S[key] = value;
  render();
  await saveKey(key, value);
}

}

function ParticipantVisualSchedule(p, mine) {

    const r = timeToRowLine(`${String(h).padStart(2,"0")}:00`);
    hourLabels.push(`<div class="tt-time" style="grid-column:1;grid-row:${r}/${r+2};">${h}:00</div>`);
  }
  const blocks = [];
  MEALS.forEach(m=>{
    const [start,end] = m.time.split("–");
    const r1=timeToRowLine(start), r2=timeToRowLine(end);
    blocks.push(`<div style="grid-column:2/${dayKeys.length+2};grid-row:${r1}/${r2};z-index:0;"><div class="tt-block meal">${esc(m.label)}</div></div>`);
  });
  dayKeys.forEach((day, i)=>{
    const col = i + 2;
    const sessions = mine.filter(a=>a.day===day);
    PRACTICE_SCHEDULE.forEach(s=>{
      if (sessions.some(a=>rangesOverlap(s.time, a.slot))) return;
      const [start,end] = s.time.split("–");
      const r1=timeToRowLine(start), r2=timeToRowLine(end);
      blocks.push(`<div style="grid-column:${col};grid-row:${r1}/${r2};"><div class="tt-block practice"><span>${esc(s.label)}</span></div></div>`);
    });
    sessions.forEach(mySession=>{
      const [start,end] = mySession.slot.split("–");
      const r1=timeToRowLine(start), r2=timeToRowLine(end);
      const c = mySession.type.toLowerCase();
      const title = mySession.type === "PHENO" ? "Pheno" : mySession.type;
      blocks.push(`<div style="grid-column:${col};grid-row:${r1}/${r2};z-index:2;"><div class="participant-experiment ${c}" data-action="viewsession" data-id="${mySession.id}"><span class="exp-title">${title}</span><span class="exp-time">${mySession.slot}</span></div></div>`);
    });
  });
  return `
  <div class="timetable-wrap">
    <div class="timetable" style="grid-template-columns:56px repeat(${dayKeys.length},minmax(90px,1fr));grid-template-rows:34px repeat(${rows},26px);">
      <div class="tt-head time-head" style="grid-column:1;"></div>
      ${dayKeys.map((d,i)=>`<div class="tt-head" style="grid-column:${i+2};">${dayShortLabel(d)}</div>`).join("")}
      ${hourLabels.join("")}
      ${blocks.join("")}
    </div>
  </div>
`;
}

function Timetable(day) {
  if (day === INSTALLATION_DAY) return DayArrivalsView(day, { title:"Installation — team &amp; equipment set-up day", showSteps:false });
  if (day === ARRIVAL_DAY_1) return DayArrivalsView(day, { title:"Arrivals", showSteps:true });

  const isArrivalDay = day === ARRIVAL_DAY_2;
  if (isArrivalDay) {
    return TimetableWithArrivals(day);
  }

  const rows = 31; // 30-min rows, 07:00 → 22:30
  const blocks = buildTimetableBlocks(day);
  const hourLabels = [];
  for (let h=7; h<=22; h++) {
    const r = timeToRowLine(`${String(h).padStart(2,"0")}:00`);
    hourLabels.push(`<div class="tt-time" style="grid-column:1;grid-row:${r}/${r+2};">${h}:00</div>`);
  }
  return `
  <div class="timetable-wrap">
    <div class="timetable" style="grid-template-rows:34px repeat(${rows},26px);">
      <div class="tt-head time-head" style="grid-column:1;"></div>
      <div class="tt-head" style="grid-column:2;">Meditation</div>
      <div class="tt-head" style="grid-column:3;">PPS</div>
      <div class="tt-head" style="grid-column:4;">CFS</div>
      <div class="tt-head" style="grid-column:5;">FBI</div>
      <div class="tt-head" style="grid-column:6;">Pheno</div>
      ${hourLabels.join("")}
      ${blocks.map(b=>`<div style="grid-column:${b.colStart}/${b.colEnd};grid-row:${b.r1}/${b.r2};z-index:${b.z!==undefined?b.z:1};">${b.html}</div>`).join("")}
    </div>
  </div>`;
}

function TimetableWithArrivals(day) {
  const isFirstArrivalDay = day === ARRIVAL_DAY_1;
  const arrivals = S.participants.filter(p=>p.arrivalDate===day).sort((a,b)=>(a.arrivalTime||"zz").localeCompare(b.arrivalTime||"zz"));
  const departures = isFirstArrivalDay ? [] : S.participants.filter(p=>p.departureDate===day).sort((a,b)=>(a.departureTime||"zz").localeCompare(b.departureTime||"zz"));

  const rows = 31;
  const blocks = buildTimetableBlocks(day, true);
  const hourLabels = [];
  for (let h=7; h<=22; h++) {
    const r = timeToRowLine(`${String(h).padStart(2,"0")}:00`);
    hourLabels.push(`<div class="tt-time" style="grid-column:1;grid-row:${r}/${r+2};">${h}:00</div>`);
  }

  const participantBlocks = [];
  arrivals.forEach((p, idx) => {
    if (p.arrivalTime && p.arrivalTime !== "morning" && p.arrivalTime !== "after lunch") {
      const r = timeToRowLine(p.arrivalTime);
      participantBlocks.push({
        colStart: 2, colEnd: 3, r1: r, r2: r+1, z: 2,
        html: `<div style="height:100%;background:#e6f0ee;border-left:3px solid #1f4a44;padding:4px;font-size:11px;font-weight:600;color:#173c37;">${getParticipantName(p.id)}</div>`
      });
    }
  });

  departures.forEach((p, idx) => {
    if (p.departureTime && p.departureTime !== "morning" && p.departureTime !== "after lunch") {
      const r = timeToRowLine(p.departureTime);
      participantBlocks.push({
        colStart: 3, colEnd: 4, r1: r, r2: r+1, z: 2,
        html: `<div style="height:100%;background:#f7e8e2;border-left:3px solid #b5533c;padding:4px;font-size:11px;font-weight:600;color:#7a3524;">${getParticipantName(p.id)}</div>`
      });
    }
  });

  const allBlocks = [...blocks, ...participantBlocks];
  const gridCols = isFirstArrivalDay ? "56px repeat(5,minmax(100px,1fr))" : "56px repeat(6,minmax(100px,1fr))";
  const minWidth = isFirstArrivalDay ? "660px" : "760px";

  return `
  <div style="margin-bottom:16px;">
    <p style="font-size:13px;color:#8a8478;margin:0 0 8px;"><span style="display:inline-block;width:12px;height:12px;background:#e6f0ee;border-left:3px solid #1f4a44;margin-right:6px;"></span>Arrivals${!isFirstArrivalDay ? ' <span style="display:inline-block;width:12px;height:12px;background:#f7e8e2;border-left:3px solid #b5533c;margin-left:16px;margin-right:6px;"></span>Departures' : ''}</p>
  </div>
  <div class="timetable-wrap">
    <div class="timetable" style="grid-template-columns:${gridCols};grid-template-rows:34px repeat(${rows},26px);min-width:${minWidth};">
      <div class="tt-head time-head" style="grid-column:1;"></div>
      <div class="tt-head" style="grid-column:2;">Arrivals</div>
      ${!isFirstArrivalDay ? '<div class="tt-head" style="grid-column:3;">Departures</div>' : ''}
      <div class="tt-head" style="grid-column:${isFirstArrivalDay ? 3 : 4};">PPS</div>
      <div class="tt-head" style="grid-column:${isFirstArrivalDay ? 4 : 5};">CFS</div>
      <div class="tt-head" style="grid-column:${isFirstArrivalDay ? 5 : 6};">FBI</div>
      <div class="tt-head" style="grid-column:${isFirstArrivalDay ? 6 : 7};">Pheno</div>
      ${hourLabels.join("")}
      ${allBlocks.map(b=>{
        const colStart = isFirstArrivalDay && b.colStart > 2 ? b.colStart - 1 : b.colStart;
        const colEnd = isFirstArrivalDay && b.colEnd > 2 ? b.colEnd - 1 : b.colEnd;
        return `<div style="grid-column:${colStart}/${colEnd};grid-row:${b.r1}/${b.r2};z-index:${b.z!==undefined?b.z:1};">${b.html}</div>`;
      }).join("")}
    </div>
  </div>`;
}

function dayShortLabel(key) {
  const found = [...WEEK1_DAYS, ...WEEK2_DAYS].find(d=>d.key===key);
  return found ? found.short : key;
}

function NoteModal() {
  const a = S.assignments.find(x=>x.id===S.ui.editingAssignmentId);
  if (!a) return "";
  const mode = S.ui.editMode; // null = menu, "move" | "swap" | "free" = detail screen
  const team = experimentTeamFor(a);
  const room = a.room || "";
  const participant = S.participants.find(p=>p.id===a.participantId);
  const draft = S.ui.editDraft || { day:a.day, time:a.slot.split("–")[0].trim() };
  const dayOptions = participant ? eligibleDays(participant) : RETREAT_DAYS[a.week];
  const previewSlot = computeSlotFromStart(a.type, draft.time || a.slot.split("–")[0].trim());

  const swapCandidates = S.assignments.filter(x=>x.id!==a.id && x.type===a.type && x.week===a.week);
  const swapTargetId = S.ui.swapTargetId || (swapCandidates[0] ? swapCandidates[0].id : null);

  const backToMenu = `<button class="btn-ghost" style="margin-bottom:10px;" data-action="setmode" data-mode="menu">← Reschedule</button>`;
  const backToRoot = `<button class="btn-ghost" style="margin-bottom:10px;" data-action="setmode" data-mode="">← Back</button>`;

  let body = "";
  if (mode === null) {
    body = `
      <div class="modal-section">
        <label style="display:block;font-size:11px;color:#8a8478;margin-bottom:4px;">Team running it</label>
        <input id="team-input" type="text" class="input" style="margin-bottom:10px;" value="${esc(team)}" placeholder="e.g. Léopoldine + Eugénie" />
        <label style="display:block;font-size:11px;color:#8a8478;margin-bottom:4px;">Room / location</label>
        <input id="room-input" type="text" class="input" style="margin-bottom:10px;" value="${esc(room)}" placeholder="e.g. Salle A" />
        <label style="display:block;font-size:11px;color:#8a8478;margin-bottom:4px;">Note</label>
        <textarea id="note-input" rows="3" placeholder="e.g. last-minute change, swap reason…">${esc(a.note)}</textarea>
        <button class="btn-primary" style="width:100%;margin-top:12px;" data-action="setmode" data-mode="menu">Reschedule →</button>
      </div>
      <div style="display:flex;justify-content:flex-end;">
        <button class="btn-primary" data-action="savenote" data-id="${a.id}">Save</button>
      </div>`;
  } else if (mode === "menu") {
    body = `
      ${backToRoot}
      <p class="modal-section-title" style="margin-bottom:10px;">Reschedule</p>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button class="week-btn" style="text-align:left;padding:12px 14px;" data-action="setmode" data-mode="move">Change date / time</button>
        <button class="week-btn" style="text-align:left;padding:12px 14px;" data-action="setmode" data-mode="swap">Swap</button>
        <button class="week-btn" style="text-align:left;padding:12px 14px;" data-action="setmode" data-mode="free">Free slot</button>
      </div>`;
  } else if (mode === "move") {
    body = `
      ${backToMenu}
      <div class="modal-section">
        <p class="modal-section-title">Change date / start time</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <select id="draft-day" class="input">
            ${dayOptions.map(d=>`<option value="${d}" ${d===draft.day?'selected':''}>${dayShortLabel(d)}</option>`).join("")}
          </select>
          <input id="draft-time" type="time" step="900" class="input" value="${esc(draft.time)}" />
        </div>
        <p style="font-size:12px;color:#8a8478;margin:10px 0 0;">This session lasts ${TYPE_DURATION_MIN[a.type]/60} h — it will run <b id="draft-preview">${previewSlot}</b>.</p>
      </div>
      <div style="display:flex;justify-content:space-between;">
        <button class="btn-ghost" style="color:#b5533c;" data-action="deleteassign" data-id="${a.id}">Remove</button>
        <button class="btn-primary" data-action="savenote" data-id="${a.id}">Save</button>
      </div>`;
  } else if (mode === "swap") {
    const target = swapCandidates.find(x=>x.id===swapTargetId);
    body = `
      ${backToMenu}
      ${swapCandidates.length === 0
        ? `<p style="font-size:13px;color:#a39c8e;">No other ${a.type} session this week to swap with.</p>`
        : `
      <div class="modal-section">
        <p class="modal-section-title">Swap with</p>
        <select id="swap-target" class="input">
          ${swapCandidates.map(x=>`<option value="${x.id}" ${x.id===swapTargetId?'selected':''}>${getParticipantName(x.participantId)} — ${dayShortLabel(x.day)} ${x.slot}</option>`).join("")}
        </select>
        ${target ? `<p style="font-size:12px;color:#8a8478;margin:10px 0 0;">${getParticipantName(a.participantId)} (${dayShortLabel(a.day)} ${a.slot}) ↔ ${getParticipantName(target.participantId)} (${dayShortLabel(target.day)} ${target.slot})</p>` : ""}
      </div>
      <div style="display:flex;justify-content:flex-end;">
        <button class="btn-primary" data-action="doswap" data-id="${a.id}">Swap</button>

    body = `
      ${backToMenu}

        <p style="font-size:13px;color:#6b6459;margin:0;">This removes <b>${getParticipantName(a.participantId)}</b> from this ${a.type} slot (${dayShortLabel(a.day)}, ${a.slot}), leaving it open for someone else.</p>

    <div class="modal" onclick="event.stopPropagation();">
      <div class="modal-head">
        <h3 style="font-size:16px;font-weight:600;">${a.type} — ${getParticipantName(a.participantId)}</h3>
        <button class="icon-btn" data-action="closemodal">×</button>
      </div>
      ${body}
    </div>
  </div>`;
}

/* ---------------------------------------------------------------- */
/* Event wiring                                                      */
/* ---------------------------------------------------------------- */
function attachEvents() {
  const loginForm = document.getElementById("login-form");
  if (loginForm) loginForm.addEventListener("submit", e=>{
    e.preventDefault();
    const val = document.getElementById("login-input").value.trim().toUpperCase();
    if (val===ADMIN_CODE) { S.session={role:"admin"}; S.ui.loginError=""; render(); return; }
    if (ALL_IDS.includes(val)) { S.session={role:"participant", id:val}; S.ui.loginError=""; render(); return; }
    S.ui.loginError = "ID not recognized. Please check and try again."; render();
  });

  document.querySelectorAll("[data-action]").forEach(el=>{
    const action = el.dataset.action;
    if (["drop","dragstart"].includes(el.dataset.actionDrop) || el.dataset.actionDrag) return; // handled separately below
  });

  document.querySelectorAll('[data-action="logout"]').forEach(el=>el.onclick=()=>{ S.session=null; render(); });
  document.querySelectorAll('[data-action="ptab"]').forEach(el=>el.onclick=()=>{ S.ui.pTab=el.dataset.tab; render(); });
  document.querySelectorAll('[data-action="viewsession"]').forEach(el=>el.onclick=()=>{ S.ui.viewingSessionId=el.dataset.id; render(); });
  document.querySelectorAll('[data-action="closesession"]').forEach(el=>el.onclick=()=>{ S.ui.viewingSessionId=null; render(); });
  document.querySelectorAll('[data-action="atab"]').forEach(el=>el.onclick=()=>{ S.ui.aTab=el.dataset.tab; render(); });
  document.querySelectorAll('[data-action="setday"]').forEach(el=>el.onclick=()=>{ S.ui.activeDay=el.dataset.day; render(); });

  document.querySelectorAll('[data-action="editassign"]').forEach(el=>{
    el.addEventListener("click", (e)=>{
      if (el._justDragged) { el._justDragged=false; return; }
      const a = S.assignments.find(x=>x.id===el.dataset.id);
      S.ui.editingAssignmentId = el.dataset.id;
      S.ui.editDraft = a ? { day:a.day, time:a.slot.split("–")[0].trim() } : null;
      S.ui.editMode = null;
      S.ui.swapTargetId = null;
      render();
    });
  });
  document.querySelectorAll('[data-action="closemodal"]').forEach(el=>el.onclick=()=>{
    S.ui.editingAssignmentId=null; S.ui.editDraft=null; S.ui.editMode=null; S.ui.swapTargetId=null; render();
  });
  document.querySelectorAll('[data-action="setmode"]').forEach(el=>el.onclick=()=>{
    S.ui.editMode = el.dataset.mode || null;
    S.ui.swapTargetId = null;
    render();
  });

  const daySelect = document.getElementById("draft-day");
  if (daySelect) daySelect.addEventListener("change", ()=>{
    S.ui.editDraft.day = daySelect.value;
    render();
  });
  const timeInput = document.getElementById("draft-time");
  if (timeInput) timeInput.addEventListener("input", ()=>{
    if (!timeInput.value) return;
    S.ui.editDraft.time = timeInput.value;
    const a = S.assignments.find(x=>x.id===S.ui.editingAssignmentId);
    const preview = document.getElementById("draft-preview");
    if (a && preview) preview.textContent = computeSlotFromStart(a.type, timeInput.value);
  });
  const swapSelect = document.getElementById("swap-target");
  if (swapSelect) swapSelect.addEventListener("change", ()=>{
    S.ui.swapTargetId = swapSelect.value;
    render();
  });

  document.querySelectorAll('[data-action="doswap"]').forEach(el=>el.onclick=()=>{
    const a = S.assignments.find(x=>x.id===el.dataset.id);
    const target = S.assignments.find(x=>x.id===S.ui.swapTargetId);
    if (!a || !target) return;
    const conflictA = S.assignments.some(x=>x.id!==a.id && x.id!==target.id && x.participantId===a.participantId && x.day===target.day);
    const conflictB = S.assignments.some(x=>x.id!==a.id && x.id!==target.id && x.participantId===target.participantId && x.day===a.day);
    if (conflictA || conflictB) {
      alert("Warning: this participant already has an experience that day.");
    }
    const next = S.assignments.map(x=>{
      if (x.id===a.id) return {...x, day:target.day, slot:target.slot, manual:true};
      if (x.id===target.id) return {...x, day:a.day, slot:a.slot, manual:true};
      return x;
    });
    S.ui.editingAssignmentId = null;
    S.ui.editDraft = null;
    S.ui.swapTargetId = null;
    persist("assignments", next);
  });

  document.querySelectorAll('[data-action="savenote"]').forEach(el=>el.onclick=()=>{
    const a = S.assignments.find(x=>x.id===el.dataset.id);
    const noteEl = document.getElementById("note-input");
    const teamEl = document.getElementById("team-input");
    const roomEl = document.getElementById("room-input");
    const note = noteEl ? noteEl.value : a.note;
    const team = teamEl ? teamEl.value : (a.team !== undefined ? a.team : EXPERIMENT_TEAMS[a.type]);
    const room = roomEl ? roomEl.value : (a.room || "");

    let day = a.day, slot = a.slot;
    if (S.ui.editDraft && (document.getElementById("draft-day") || document.getElementById("draft-time"))) {
      const newDay = S.ui.editDraft.day;
      const newTime = S.ui.editDraft.time;
      const newSlot = computeSlotFromStart(a.type, newTime);
      if (newDay !== a.day || newSlot !== a.slot) {
        const occupying = S.assignments.find(x=>x.id!==a.id && x.type===a.type && x.day===newDay && rangesOverlap(x.slot, newSlot));
        if (occupying) { alert("This time overlaps an existing "+a.type+" session ("+getParticipantName(occupying.participantId)+", "+occupying.slot+")."); return; }
        const conflict = S.assignments.find(x=>x.id!==a.id && x.participantId===a.participantId && x.day===newDay);
        if (conflict) { alert("Warning: this participant already has an experience that day."); }
        day = newDay; slot = newSlot;
      }
    }
    const next = S.assignments.map(x=>x.id===el.dataset.id ? {...x, note, team, room, day, slot, manual:true} : x);
    S.ui.editingAssignmentId = null;
    S.ui.editDraft = null;
    persist("assignments", next);
  });
  document.querySelectorAll('[data-action="deleteassign"]').forEach(el=>el.onclick=()=>{
    const next = S.assignments.filter(a=>a.id!==el.dataset.id);
    S.ui.editingAssignmentId = null;
    S.ui.editDraft = null;
    S.ui.editMode = null;
    persist("assignments", next);
  });

  document.querySelectorAll('[data-action="addassign"]').forEach(el=>{
    el.addEventListener("click", ()=>{
      S.ui.addTarget = { type:el.dataset.type, day:el.dataset.day, slot:el.dataset.slot };
      S.ui.addParticipantId = null;
      render();
    });
  });
  document.querySelectorAll('[data-action="closeaddmodal"]').forEach(el=>el.onclick=()=>{
    S.ui.addTarget = null; S.ui.addParticipantId = null; render();
  });
  const addSelect = document.getElementById("add-participant");
  if (addSelect) addSelect.addEventListener("change", ()=>{ S.ui.addParticipantId = addSelect.value; });
  document.querySelectorAll('[data-action="confirmadd"]').forEach(el=>el.onclick=()=>{
    const sel = document.getElementById("add-participant");
    const participantId = sel ? sel.value : S.ui.addParticipantId;
    const { type, day, slot } = S.ui.addTarget;
    if (!participantId) return;
    const occupying = S.assignments.find(x=>x.type===type && x.day===day && rangesOverlap(x.slot, slot));
    if (occupying) { alert("This slot is already taken by "+getParticipantName(occupying.participantId)+"."); return; }
    const dayConflict = S.assignments.some(x=>x.participantId===participantId && x.day===day);
    if (dayConflict) { alert("Warning: this participant already has an experience that day."); }
    const week = RETREAT_DAYS[1].includes(day) ? 1 : 2;
    const next = [...S.assignments, {
      id: participantId+"-"+type+"-"+Date.now(),
      participantId, type, day, slot, note:"", week, manual:true,
    }];
    S.ui.addTarget = null;
    S.ui.addParticipantId = null;
    persist("assignments", next);
  });

  // drag & drop
  document.querySelectorAll('.chip[draggable="true"]').forEach(el=>{
    el.addEventListener("dragstart", (e)=>{
      e.dataTransfer.setData("text/plain", el.dataset.assignid);
      el._justDragged = true;
    });
  });
  document.querySelectorAll('.cell[data-action-drop="drop"]').forEach(el=>{
    el.addEventListener("dragenter", ()=>{ S.ui.dragOverKey = el.dataset.cellkey; render(); });
    el.addEventListener("dragleave", ()=>{ if (S.ui.dragOverKey===el.dataset.cellkey){ S.ui.dragOverKey=null; render(); } });
    el.addEventListener("drop", (e)=>{
      e.preventDefault();
      S.ui.dragOverKey = null;
      const rawId = e.dataTransfer.getData("text/plain");
      const moved = S.assignments.find(a=>a.id===rawId);
      if (!moved) { render(); return; }
      const target = { type: el.dataset.type, day: el.dataset.day, slot: el.dataset.slot };
      if (moved.type !== target.type) { render(); return; }
      const occupying = S.assignments.filter(a=>a.id!==moved.id && a.type===target.type && a.day===target.day && rangesOverlap(a.slot, target.slot));
      if (occupying.length >= capFor(target.type)) { alert("This slot is already full."); render(); return; }
      const conflict = S.assignments.find(a=>a.id!==moved.id && a.participantId===moved.participantId && a.day===target.day);
      if (conflict) { alert("Warning: this participant already has an experience that day."); }
      const next = S.assignments.map(a=>a.id===moved.id ? {...a, day:target.day, slot:target.slot, manual:true} : a);
      persist("assignments", next);
    });
  });

  // participants table
  document.querySelectorAll('[data-action="editp"]').forEach(el=>{
    el.addEventListener("change", ()=>{
      const next = S.participants.map(p=>p.id===el.dataset.id ? {...p, [el.dataset.field]: el.value} : p);
      persist("participants", next);
    });
  });

  // links tab
  const addLinkBtn = document.querySelector('[data-action="addlink"]');
  if (addLinkBtn) addLinkBtn.onclick = ()=>{
    const label = document.getElementById("link-label").value.trim();
    const url = document.getElementById("link-url").value.trim();
    const scope = document.getElementById("link-scope").value;
    if (!label || !url) return;
    const next = [...S.links, { id:"link-"+Date.now(), label, url, scope }];
    S.ui.linkForm = { label:"", url:"", scope:"global" };
    persist("links", next);
  };
  document.querySelectorAll('[data-action="removelink"]').forEach(el=>el.onclick=()=>{
    persist("links", S.links.filter(l=>l.id!==el.dataset.id));
  });

  // announcements tab
  const announcementInput = document.getElementById("announcement-input");
  if (announcementInput) announcementInput.addEventListener("input", ()=>{ S.ui.announcementDraft = announcementInput.value; });
  const announcementAudienceSelect = document.getElementById("announcement-audience");
  if (announcementAudienceSelect) announcementAudienceSelect.addEventListener("change", ()=>{ S.ui.announcementAudience = announcementAudienceSelect.value; });
  const addAnnouncementBtn = document.querySelector('[data-action="addannouncement"]');
  if (addAnnouncementBtn) addAnnouncementBtn.onclick = ()=>{
    const text = (announcementInput ? announcementInput.value : S.ui.announcementDraft).trim();
    if (!text) return;
    const audience = announcementAudienceSelect ? announcementAudienceSelect.value : S.ui.announcementAudience;
    const next = [...S.announcements, { id:"ann-"+Date.now(), text, audience, ts:Date.now() }];
    S.ui.announcementDraft = "";
    persist("announcements", next);
  };
  document.querySelectorAll('[data-action="removeannouncement"]').forEach(el=>el.onclick=()=>{
    persist("announcements", S.announcements.filter(a=>a.id!==el.dataset.id));
  });
}

/* ---------------------------------------------------------------- */
/* Boot                                                               */
/* ---------------------------------------------------------------- */
(async function boot(){
  const state = await loadState();
  S.participants = state.participants;
  S.assignments = state.assignments;
  S.links = state.links;
  S.announcements = state.announcements || [];
  S.ready = true;
  setConnStatus("ok");
  render();

  // Real-time sync — any change made on one tablet/computer is pushed
  // live to every other device connected to this page.
  STORE_KEYS.forEach(key => {
    db.ref(key).on("value", (snap) => {
      if (snap.exists()) {
        S[key] = snap.val();
        render();
      }
    }, (err) => {
      console.error("firebase listener error", key, err);
      setConnStatus("err");
    });
  });
})();
</script>
</body>
</html>
